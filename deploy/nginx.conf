server {
    # 生产环境应在此处或前置负载均衡上终止 TLS，并在控制面公共 API 前增加认证。
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 源码/产物大文件传输与业务 API 同端口（业务 30s 超时预算在应用层按路由生效，
    # 传输自带 10 分钟绝对截止）；body 上限按实例源码上限放宽。
    location /transfer/ {
        client_max_body_size 0;
        proxy_pass http://control:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 128k;
        # control 默认只监听 127.0.0.1:8080，容器或跨主机部署时需设置 PUBLIC_ADDR=:8080。
        proxy_pass http://control:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# /healthz 与 /metrics 在控制面的管理监听（--admin-addr，默认 127.0.0.1:8082），
# 不经公网反向代理；Prometheus 抓取走管理网络或带访问控制的内部通道。
