services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      # 只绑定本机回环地址，避免演示用的弱口令数据库暴露到局域网。
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      # 官方镜像默认关闭 protected mode 且没有密码，只允许本机访问。
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
