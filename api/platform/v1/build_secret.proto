syntax = "proto3";
package platform.v1;
option go_package = "github.com/sunshanpeng/yummy/gen/go/platform/v1;platformv1";
service BuildSecretService {
  rpc ListBuildSecrets(ListBuildSecretsRequest) returns (ListBuildSecretsResponse);
  rpc CreateBuildSecret(CreateBuildSecretRequest) returns (CreateBuildSecretResponse);
  rpc ReplaceBuildSecret(ReplaceBuildSecretRequest) returns (ReplaceBuildSecretResponse);
  rpc DeactivateBuildSecret(DeactivateBuildSecretRequest) returns (DeactivateBuildSecretResponse);
}
message BuildSecret { string id = 1; string name = 2; string purpose = 3; string status = 4; int64 current_version = 5; bool configured = 6; string created_at = 7; string updated_at = 8; }
message ListBuildSecretsRequest { string workspace_id = 1; string application_id = 2; int32 limit = 3; string cursor = 4; }
message ListBuildSecretsResponse { repeated BuildSecret secrets = 1; string next_cursor = 2; }
message CreateBuildSecretRequest { string workspace_id = 1; string application_id = 2; string name = 3; string purpose = 4; string value = 5; }
message CreateBuildSecretResponse { BuildSecret secret = 1; }
message ReplaceBuildSecretRequest { string workspace_id = 1; string application_id = 2; string secret_id = 3; int64 expected_version = 4; string value = 5; }
message ReplaceBuildSecretResponse { BuildSecret secret = 1; }
message DeactivateBuildSecretRequest { string workspace_id = 1; string application_id = 2; string secret_id = 3; int64 expected_version = 4; }
message DeactivateBuildSecretResponse {}
