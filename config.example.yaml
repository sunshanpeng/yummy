# Yummy 启动配置文件示例。
# 用法：bin/platform serve --config /etc/yummy/config.yaml
# 未显式指定时依次查找 ./config.yaml、/etc/yummy/config.yaml。
# 优先级：显式命令行参数 > 本配置文件 > 环境变量 > 内置默认值。
# 键名与命令行 flag 一致（kebab-case，连接符转下划线即为环境变量名）。
# 含密钥的文件权限建议 0600。运行中可修改的参数不在此文件（走数据库 instance_settings）。

# ---- 数据库与缓存（启动时加载，改后需重启） ----
database-url: "postgres://demo:demo@localhost:5432/demo?sslmode=disable"
redis-addr: "localhost:6379"

# ---- 监听地址 ----
public-addr: "127.0.0.1:8080"        # 页面 / Connect API / OAuth / /transfer 大文件传输
admin-addr: "127.0.0.1:8082"         # 管理面：/healthz 与 /metrics，只绑回环，公网不可达
worker-addr: "127.0.0.1:8443"        # worker mTLS 网关

# ---- 密钥（三把必须互相独立，Base64 编码 32 字节；master-key 必须随数据库备份） ----
# session-key: ""
# csrf-key: ""
# master-key: ""

# ---- 公开站点与源码归档 ----
# public-base-url: "https://control.example.com"
# source-root: "/var/lib/yummy/source"

# ---- OAuth（留空关闭 OAuth 与远端 MCP） ----
# oauth-key: ""

# ---- worker 网关 TLS（留空禁用登记） ----
# worker-ca-cert: "/etc/yummy/worker-ca.crt"
# worker-ca-key: "/etc/yummy/worker-ca.key"
# worker-cert: "/etc/yummy/worker.crt"
# worker-key: "/etc/yummy/worker.key"

# ---- 可观测性 ----
# otel-endpoint: "http://127.0.0.1:4318"   # 也兼容标准环境变量 OTEL_EXPORTER_OTLP_ENDPOINT
# log-level: "info"                         # debug / info / warn / error
# metrics-pull: false                       # 在公共端口暴露 /metrics 供 Prometheus 抓取

# ---- 开发开关（生产禁止开启） ----
# allow-local-http: false
# behind-tls-proxy: false
